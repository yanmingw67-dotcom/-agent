[project]
name = "product-knowledge-backend"
version = "0.1.0"
description = "产品功能参数评估系统：P1.1 安全导入基础"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.121.3",
  "starlette==0.50.0",
  "uvicorn==0.34.2",
  "pydantic==2.11.4",
  "pydantic-settings==2.9.1",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.41",
  "alembic==1.15.2",
  "psycopg[binary]==3.2.9",
  "redis==5.2.1",
  "rq==2.3.3",
]
[dependency-groups]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "httpx==0.28.1", "ruff==0.11.10"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = ["infrastructure: 需要实际 PostgreSQL 和 Redis 的集成测试"]
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["storage"]
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]
