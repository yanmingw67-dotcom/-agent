name: product-knowledge-p11
x-app: &app
  build: .
  image: product-knowledge:p1.3
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://knowledge:${POSTGRES_PASSWORD:?请先生成 .env}@postgres:5432/knowledge
    REDIS_URL: redis://redis:6379/0
    ADMIN_TOKEN: ${ADMIN_TOKEN:?请先生成 .env}
    READ_TOKEN: ${READ_TOKEN:?请先生成 .env}
    ARCHIVE_ROOT: /data/archives
    INGESTION_ROOT: /data/ingestion
    SOURCE_ROOT: /data/sources
    DOCUMENTS_ROOT: /data/documents
    STORAGE_CONTROL_ROOT: /data/control
  read_only: true
  tmpfs: ["/tmp:size=128m,mode=1777"]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  pids_limit: 128
  mem_limit: 768m
  cpus: 0.5
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
services:
  api:
    <<: *app
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --no-access-log"]
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    mem_limit: 512m
    volumes:
      - archives:/data/archives
      - sources:/data/sources:ro
      - documents:/data/documents
      - control:/data/control
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 20
  worker:
    <<: *app
    cpus: 0.25
    command: ["python", "-m", "app.jobs.worker"]
    volumes:
      - archives:/data/archives:ro
      - sources:/data/ingestion
      - sources:/data/sources:ro
      - documents:/data/documents:ro
      - control:/data/control
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; from app.jobs.queue import connection; connection().ping(); assert time.time()-float(Path('/tmp/knowledge-worker-heartbeat').read_text()) < 360"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
  indexer:
    <<: *app
    environment:
      <<: *app-env
      WORKER_KIND: index
      JOB_TIMEOUT_SECONDS: 1800
    command: ["python", "-m", "app.jobs.worker"]
    cpus: 0.75
    mem_limit: 1280m
    volumes:
      - sources:/data/sources:ro
      - documents:/data/documents:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; assert time.time()-float(Path('/tmp/knowledge-worker-heartbeat').read_text()) < 1860"]
      interval: 10s
      timeout: 5s
      retries: 6
  builder:
    <<: *app
    environment:
      <<: *app-env
      WORKER_KIND: builder
      BUILDER_MODEL: ${BUILDER_MODEL:-}
      BUILDER_BASE_URL: ${BUILDER_BASE_URL:-}
      BUILDER_API_KEY: ${BUILDER_API_KEY:-}
      BUILDER_ALLOW_SYNTHETIC: ${BUILDER_ALLOW_SYNTHETIC:-false}
      BUILDER_ALLOW_ENTERPRISE: ${BUILDER_ALLOW_ENTERPRISE:-false}
      BUILDER_INPUT_USD_PER_MILLION: ${BUILDER_INPUT_USD_PER_MILLION:-}
      BUILDER_OUTPUT_USD_PER_MILLION: ${BUILDER_OUTPUT_USD_PER_MILLION:-}
      BUILDER_MAX_REQUESTS: ${BUILDER_MAX_REQUESTS:-8}
      BUILDER_MAX_TOOL_CALLS: ${BUILDER_MAX_TOOL_CALLS:-30}
      BUILDER_MAX_TOKENS: ${BUILDER_MAX_TOKENS:-30000}
      BUILDER_MAX_CONTEXT_CHARS: ${BUILDER_MAX_CONTEXT_CHARS:-80000}
      BUILDER_REASONING_EFFORT: ${BUILDER_REASONING_EFFORT:-}
      BUILDER_MAX_OUTPUT_TOKENS: ${BUILDER_MAX_OUTPUT_TOKENS:-4000}
    command: ["python", "-m", "app.jobs.worker"]
    cpus: 0.5
    mem_limit: 1024m
    volumes:
      - sources:/data/sources:ro
      - documents:/data/documents:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; assert time.time()-float(Path('/tmp/knowledge-worker-heartbeat').read_text()) < 1860"]
      interval: 10s
      timeout: 5s
      retries: 6
  retrieval:
    <<: *app
    environment:
      <<: *app-env
      SERVICE_MODE: retrieval
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--limit-concurrency", "16", "--timeout-keep-alive", "5", "--no-access-log"]
    cpus: 1
    mem_limit: 768m
    ports: ["127.0.0.1:${RETRIEVAL_PORT:-8001}:8000"]
    volumes:
      - sources:/data/sources:ro
      - documents:/data/documents:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 20
  postgres:
    image: postgres:16.9-bookworm
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先生成 .env}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=4MB", "-c", "max_connections=50"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    mem_limit: 1536m
    cpus: 0.75
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4.4-bookworm
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis_data:/data"]
    mem_limit: 256m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  archives:
  sources:
  postgres_data:
  redis_data:
  documents:
  control:
