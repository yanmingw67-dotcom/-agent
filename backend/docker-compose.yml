name: product-knowledge-p11
x-app: &app
  build: .
  image: product-knowledge:p1.1
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://knowledge:${POSTGRES_PASSWORD:?请先生成 .env}@postgres:5432/knowledge
    REDIS_URL: redis://redis:6379/0
    ADMIN_TOKEN: ${ADMIN_TOKEN:?请先生成 .env}
    READ_TOKEN: ${READ_TOKEN:?请先生成 .env}
    ARCHIVE_ROOT: /data/archives
    INGESTION_ROOT: /data/ingestion
    SOURCE_ROOT: /data/sources
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  pids_limit: 128
  mem_limit: 768m
  cpus: 2
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
services:
  api:
    <<: *app
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --no-access-log"]
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    volumes:
      - archives:/data/archives
      - sources:/data/sources:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 20
  worker:
    <<: *app
    command: ["python", "-m", "app.jobs.worker"]
    volumes:
      - archives:/data/archives:ro
      # 仅导入任务可写；后续分析工具必须只使用 SOURCE_ROOT。
      - sources:/data/ingestion
      - sources:/data/sources:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; from app.jobs.queue import connection; from app.core.config import get_settings; connection().ping(); assert time.time()-float(Path('/tmp/knowledge-worker-heartbeat').read_text()) < get_settings().job_timeout_seconds+60"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
  postgres:
    image: postgres:16.9-bookworm
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先生成 .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped
  redis:
    image: redis:7.4.4-bookworm
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    restart: unless-stopped
volumes:
  archives:
  sources:
  postgres_data:
  redis_data:
